zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: f56fc5fd95a14552b057119d85158cae
    name: Templates/Wiren Board
  templates:
  - uuid: e85db7fd10624314aa4d76a6b56e041a
    template: WB-MS WB-MSW by MQTT
    name: WB-MS / WB-MSW by MQTT
    groups:
    - name: Templates/Wiren Board
    items:
    - uuid: 89b0ab0c04fd46698d955f5acf098740
      name: MQTT raw stream
      type: ZABBIX_ACTIVE
      key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: 359b6bab0a204795a3b70ddedf6382f7
      name: Temperature
      type: DEPENDENT
      key: wb.ctrl["Temperature"]
      history: 7d
      value_type: FLOAT
      units: °C
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Temperature']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
    - uuid: 73d89595006a4d74b0a1f9dc30ff4737
      name: Temperature (error)
      type: DEPENDENT
      key: wb.err["Temperature"]
      history: 7d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Temperature/meta/error']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      triggers:
      - uuid: 398dcab7d2a84c80bbb253f2ce137baf
        expression: length(last(/WB-MS WB-MSW by MQTT/wb.err["Temperature"]))>0
        name: 'WB {HOST.HOST}: error on "Temperature" ({ITEM.VALUE1})'
        priority: AVERAGE
        manual_close: 'YES'
