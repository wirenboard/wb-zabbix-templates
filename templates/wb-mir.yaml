zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: d4c1e3380fac4cb49ceea4a74b5d4700
    name: Templates/Wiren Board
  templates:
  - uuid: d21963d959d14eed88097b096dd386cb
    template: WB-MIR by MQTT
    name: WB-MIR by MQTT
    groups:
    - name: Templates/Wiren Board
    items:
    - uuid: 060c39e049814dc6ac2e43e69a0ad1cb
      name: MQTT raw stream
      type: ZABBIX_ACTIVE
      key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: 7e6515f7ca4840a881648c6550f851c7
      name: Input Voltage
      type: DEPENDENT
      key: wb.ctrl["Input Voltage"]
      history: 7d
      value_type: FLOAT
      units: V
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Input Voltage']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
    - uuid: ccdb82dca7bb45e2a33d43c9cfb231d6
      name: Input Voltage (error)
      type: DEPENDENT
      key: wb.err["Input Voltage"]
      history: 7d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Input Voltage/meta/error']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      triggers:
      - uuid: 6b8a050e98924daf8501422597d4aeb0
        expression: length(last(/WB-MIR by MQTT/wb.err["Input Voltage"]))>0
        name: 'WB {HOST.HOST}: error on "Input Voltage" ({ITEM.VALUE1})'
        priority: AVERAGE
        manual_close: 'YES'
