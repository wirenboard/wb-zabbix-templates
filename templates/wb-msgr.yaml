      name: Relay
      type: DEPENDENT
      key: wb.ctrl["Relay"]
      history: 7d
      value_type: UNSIGNED
      valuemap:
        name: WB binary state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Relay']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
