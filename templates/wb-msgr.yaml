        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      triggers:
      - uuid: 0f0934dc9e424100919f299198ea5d55
        expression: length(last(/WB-MSGR by MQTT/wb.err["Relay"]))>0
        name: 'WB {HOST.HOST}: error on "Relay" ({ITEM.VALUE1})'
        priority: AVERAGE
        manual_close: 'YES'
