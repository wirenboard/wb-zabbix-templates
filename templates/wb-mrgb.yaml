        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      triggers:
      - uuid: c544b06dcf9a44029e2ef6a9f68cbd81
        expression: length(last(/WB-MRGB by MQTT/wb.err["RGB"]))>0
        name: 'WB {HOST.HOST}: error on "RGB" ({ITEM.VALUE1})'
        priority: AVERAGE
        manual_close: 'YES'
