      name: MQTT raw stream
      type: ZABBIX_ACTIVE
      key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: 393efa986ff74b548b82937f25b127ac
      name: RGB
      type: DEPENDENT
      key: wb.ctrl["RGB"]
      history: 7d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/RGB']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
    - uuid: d435731ae9b944659f5558c3777d4cef
