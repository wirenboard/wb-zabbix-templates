      type: ZABBIX_ACTIVE
      key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: 4a34703f6a174b03b75ac69ecf26dadf
      name: Learn to RAM
      type: DEPENDENT
      key: wb.ctrl["Learn to RAM"]
      history: 7d
      value_type: UNSIGNED
      valuemap:
        name: WB binary state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Learn to RAM']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
