zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 8083f07841b24d25bd6b758ea88e4b48
    name: Templates/Wiren Board
  templates:
  - uuid: 721a6a75d5c441df960dbb1a95dd7b1f
    template: WB-MS-THLS by MQTT
    name: WB-MS-THLS by MQTT
    groups:
    - name: Templates/Wiren Board
    items:
    - uuid: 5f9f83bc0bda46ad8e2aeb63e8e07c05
      name: MQTT raw stream
      type: ZABBIX_ACTIVE
      key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: 03ae9a0f6f7341e5a647a00d88adbbf1
      name: Temperature
      type: DEPENDENT
      key: wb.ctrl["Temperature"]
      history: 7d
      value_type: FLOAT
      units: °C
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Temperature']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
    - uuid: 6a9946cd4e444770808c9d3e3f20fcea
      name: Temperature (error)
      type: DEPENDENT
      key: wb.err["Temperature"]
      history: 7d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Temperature/meta/error']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      triggers:
      - uuid: 74e56e4492c24d7aac7b27282629e155
        expression: length(last(/WB-MS-THLS by MQTT/wb.err["Temperature"]))>0
        name: 'WB {HOST.HOST}: error on "Temperature" ({ITEM.VALUE1})'
        priority: AVERAGE
        manual_close: 'YES'
