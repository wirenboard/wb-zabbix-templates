      type: ZABBIX_ACTIVE
      key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: ed2e69792e9347c9af6610e7d4bb2b61
      name: Input 1
      type: DEPENDENT
      key: wb.ctrl["Input 1"]
      history: 7d
      value_type: UNSIGNED
      valuemap:
        name: WB binary state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Input 1']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
    - uuid: 7a4acaf18ede41758578f35c44bcdec0
