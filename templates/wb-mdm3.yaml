      key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: da243f62f4f34ae6aff895b7977215dc
      name: Input 1
      type: DEPENDENT
      key: wb.ctrl["Input 1"]
      history: 7d
      value_type: UNSIGNED
      valuemap:
        name: WB binary state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/Input 1']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
