      delay: '0'
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: 9d5f4b8ac0654c8d9fb50f78e3fb196c
      name: RGB Strip
      type: DEPENDENT
      key: wb.ctrl["RGB Strip"]
      history: 7d
      value_type: UNSIGNED
      valuemap:
        name: WB binary state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $['/devices/{$DEVICE}/controls/RGB Strip']
        error_handler: DISCARD_VALUE
      master_item:
        key: mqtt.get[tcp://{$MQTT.BROKER}:{$MQTT.PORT},/devices/{$DEVICE}/#]
